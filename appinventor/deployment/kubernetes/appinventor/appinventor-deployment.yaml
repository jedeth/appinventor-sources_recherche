---
# MIT App Inventor - Main Application
# Java/Tomcat Web Application
# RGPD Compliant - Paris DSI
apiVersion: v1
kind: ConfigMap
metadata:
  name: appinventor-config
  namespace: appinventor
  labels:
    app: appinventor
    component: webapp
data:
  # Configuration système (remplace appengine-web.xml)
  app.properties: |
    # Storage Backend (Phase 3)
    storage.backend=s3

    # MinIO Configuration (S3-compatible)
    s3.endpoint=http://minio.appinventor.svc.cluster.local:9000
    s3.region=eu-west-3
    s3.path.style=true

    # Buckets
    gcs.bucket=appinventor-projects
    gcs.apkbucket=appinventor-builds

    # Database Configuration (Phase 4)
    db.backend=postgresql
    db.host=postgresql.appinventor.svc.cluster.local
    db.port=5432
    db.name=appinventor

    # Redis Configuration (Phase 1 + Sessions)
    cache.backend=redis
    redis.host=redis.appinventor.svc.cluster.local
    redis.port=6379
    redis.sentinel.enabled=true
    redis.sentinel.master=appinventor-redis
    redis.sentinel.nodes=redis-sentinel.appinventor.svc.cluster.local:26379

    # Rendezvous Server (WebRTC)
    use.rendezvousserver=http://rendezvous.appinventor.svc.cluster.local:8888

    # Build Server
    build.server.host=buildserver.appinventor.svc.cluster.local:9990

    # CloudDB Configuration (si utilisé)
    clouddb.server=clouddb.example.com

    # Session Configuration
    session.idletimeout=120
    session.renew=30

    # RGPD Compliance
    data.location=paris-dsi
    compliance.mode=rgpd
    timezone=Europe/Paris

    # Analytics (désactivé pour RGPD)
    analytics.enabled=false
    google.analytics.tracking.id=

    # Logging
    log.level=INFO
    log.to.console=true

---
apiVersion: v1
kind: Service
metadata:
  name: appinventor
  namespace: appinventor
  labels:
    app: appinventor
    component: webapp
spec:
  type: ClusterIP
  ports:
    - port: 8080
      name: http
      protocol: TCP
      targetPort: 8080
  selector:
    app: appinventor
    component: webapp

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appinventor
  namespace: appinventor
  labels:
    app: appinventor
    component: webapp
    compliance: rgpd
spec:
  replicas: 3  # 3 réplicas pour HA
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero downtime

  selector:
    matchLabels:
      app: appinventor
      component: webapp

  template:
    metadata:
      labels:
        app: appinventor
        component: webapp
      annotations:
        # Force reload si ConfigMap change
        checksum/config: "{{ .Values.configChecksum }}"

    spec:
      # Anti-affinity (distribuer sur différents nodes)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - appinventor
                    - key: component
                      operator: In
                      values:
                        - webapp
                topologyKey: kubernetes.io/hostname

      # Init container pour attendre les dépendances
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              set -ex
              echo "Waiting for PostgreSQL..."
              until nc -z postgresql.appinventor.svc.cluster.local 5432; do
                echo "PostgreSQL not ready, waiting..."
                sleep 5
              done

              echo "Waiting for Redis..."
              until nc -z redis.appinventor.svc.cluster.local 6379; do
                echo "Redis not ready, waiting..."
                sleep 5
              done

              echo "Waiting for MinIO..."
              until nc -z minio.appinventor.svc.cluster.local 9000; do
                echo "MinIO not ready, waiting..."
                sleep 5
              done

              echo "All dependencies are ready!"

      containers:
        - name: appinventor
          # NOTE: Cette image doit être construite à partir du code source
          # Voir: appinventor/deployment/docker/Dockerfile.appinventor
          image: localhost:5000/appinventor:latest
          imagePullPolicy: Always

          # Variables d'environnement
          env:
            # Configuration depuis ConfigMap
            - name: JAVA_OPTS
              value: "-Xmx8g -Xms4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

            # TimeZone (RGPD - France)
            - name: TZ
              value: "Europe/Paris"

            # Database credentials
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: appinventor-user

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: appinventor-password

            # Redis credentials
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password

            # MinIO credentials
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: access-key

            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key

            # Build server password
            - name: BUILD_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buildserver-credentials
                  key: password

            # Session secret (pour signing)
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: appinventor-secrets
                  key: session-secret

            # CloudDB UUID secret
            - name: CLOUDDB_UUID_SECRET
              valueFrom:
                secretKeyRef:
                  name: appinventor-secrets
                  key: clouddb-uuid-secret

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          # Health checks
          livenessProbe:
            httpGet:
              path: /_ah/health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /_ah/ready
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Startup probe (pour le démarrage initial lent)
          startupProbe:
            httpGet:
              path: /_ah/health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30  # 300s = 5 minutes max

          # Ressources
          resources:
            requests:
              memory: "8Gi"
              cpu: "4000m"
            limits:
              memory: "12Gi"
              cpu: "8000m"

          # Volume mounts
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp

          # Sécurité
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Tomcat needs write to logs
            capabilities:
              drop:
                - ALL

      # Volumes
      volumes:
        - name: config
          configMap:
            name: appinventor-config

        - name: tmp
          emptyDir:
            sizeLimit: 10Gi

      # Service Account
      serviceAccountName: appinventor

---
# ServiceAccount pour App Inventor
apiVersion: v1
kind: ServiceAccount
metadata:
  name: appinventor
  namespace: appinventor
  labels:
    app: appinventor

---
# HorizontalPodAutoscaler pour scaling automatique
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: appinventor
  namespace: appinventor
  labels:
    app: appinventor
    component: webapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: appinventor
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes avant de scale down
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60

---
# PodDisruptionBudget pour garantir disponibilité
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: appinventor
  namespace: appinventor
  labels:
    app: appinventor
    component: webapp
spec:
  minAvailable: 2  # Au moins 2 pods disponibles pendant maintenance
  selector:
    matchLabels:
      app: appinventor
      component: webapp
