# App Inventor Server Deployment (Phase 4)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appinventor-server
  namespace: appinventor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appinventor-server
  template:
    metadata:
      labels:
        app: appinventor-server
    spec:
      containers:
      - name: appinventor
        image: appinventor-server:phase4-latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: "postgresql-0.postgresql-headless.appinventor.svc.cluster.local"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-credentials
              key: app-password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: access-key
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: secret-key
---
apiVersion: v1
kind: Service
metadata:
  name: appinventor-service
  namespace: appinventor
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
  selector:
    app: appinventor-server
