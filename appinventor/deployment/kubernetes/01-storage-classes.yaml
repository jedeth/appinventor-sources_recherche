---
# Storage Classes pour différents types de stockage
# Adapté pour infrastructure on-premise avec disques locaux

# Storage Class pour PostgreSQL (SSD NVMe haute performance)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-ssd
  labels:
    type: ssd-nvme
provisioner: kubernetes.io/no-provisioner  # Local storage
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: true

---
# Storage Class pour MinIO (HDD RAID pour capacité)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: bulk-storage
  labels:
    type: hdd-raid
provisioner: kubernetes.io/no-provisioner  # Local storage
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: true

---
# Persistent Volumes pour PostgreSQL (à créer sur chaque node)
# Node 1 - Primary
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgresql-pv-0
  labels:
    type: fast-ssd
    component: postgresql
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fast-ssd
  local:
    path: /mnt/ssd-nvme/postgresql-0  # À créer sur votre serveur
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - your-node-1  # REMPLACER par le nom réel de votre node

