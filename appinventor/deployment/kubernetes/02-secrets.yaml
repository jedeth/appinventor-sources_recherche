---
# Secrets pour MIT App Inventor
# ⚠️ IMPORTANT : Ce fichier contient des valeurs d'exemple
# ⚠️ NE JAMAIS commiter ce fichier avec de vraies valeurs !
# ⚠️ Utiliser kubectl create secret ou sealed-secrets en production

# Pour créer les secrets en base64 :
# echo -n "your-password" | base64

---
# MinIO credentials
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: appinventor
type: Opaque
data:
  # REMPLACER ces valeurs !
  # root-user: minioadmin (base64: bWluaW9hZG1pbg==)
  # root-password: minioadmin (base64: bWluaW9hZG1pbg==)
  root-user: bWluaW9hZG1pbg==
  root-password: bWluaW9hZG1pbg==
  # Pour générer un mot de passe fort:
  # openssl rand -base64 32 | base64

---
# PostgreSQL credentials
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: appinventor
type: Opaque
data:
  # REMPLACER ces valeurs !
  # postgres-password: changeme (base64)
  # appinventor-password: changeme (base64)
  postgres-password: Y2hhbmdlbWU=
  appinventor-password: Y2hhbmdlbWU=
  # Générer: openssl rand -base64 32 | base64

---
# Redis credentials
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: appinventor
type: Opaque
data:
  # REMPLACER cette valeur !
  # redis-password: changeme (base64)
  redis-password: Y2hhbmdlbWU=

---
# App Inventor application secrets
apiVersion: v1
kind: Secret
metadata:
  name: appinventor-secrets
  namespace: appinventor
type: Opaque
data:
  # Build server password
  build-server-password: Y2hhbmdlbWU=

  # CloudDB UUID secret
  clouddb-uuid-secret: Y2hhbmdlbWU=

  # Session secret
  session-secret: Y2hhbmdlbWU=

  # Keyczar auth key (si nécessaire)
  # authkey: <base64-encoded-zip-file>

---
# TLS Certificates (auto-generés ou Let's Encrypt)
# Pour générer un certificat self-signed de test :
# openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout tls.key -out tls.crt \
#   -subj "/CN=appinventor.dsi.paris.fr/O=DSI Paris"
# kubectl create secret tls appinventor-tls \
#   --cert=tls.crt --key=tls.key -n appinventor
apiVersion: v1
kind: Secret
metadata:
  name: appinventor-tls
  namespace: appinventor
type: kubernetes.io/tls
data:
  # REMPLACER avec vos vrais certificats !
  tls.crt: LS0tLS1CRUdJTi... # Certificat base64
  tls.key: LS0tLS1CRUdJTi... # Clé privée base64

---
